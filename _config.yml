title: Sudhanshu Pandey
tagline: Scientist, NASA Jet Propulsion Laboratory
description: >-
  Scientist at NASA's Jet Propulsion Laboratory studying greenhouse gases, air
  quality, and the carbon cycle with satellite observations, atmospheric models,
  and machine learning.
author: Sudhanshu Pandey
baseurl: ""
url: "https://sudshu.github.io"
github_username: sudshu

# The site's own layouts in _layouts/ replace all of minima's. The theme stays
# listed so GitHub Pages builds exactly as before.
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

show_excerpts: true
date_format: "%b %-d, %Y"

# Homepage text lives in _data/home.yml.

# giscus comments (GitHub Discussions). Comments stay hidden until repo_id AND
# category_id are filled — get both from https://giscus.app after (1) enabling
# Discussions on this repo and (2) installing the giscus app on it.
giscus:
  repo: "sudshu/sudshu.github.io"
  repo_id: ""              # <-- paste data-repo-id from giscus.app
  category: "Announcements"
  category_id: ""          # <-- paste data-category-id from giscus.app
  mapping: "pathname"
  reactions_enabled: "1"
  theme: "preferred_color_scheme"
