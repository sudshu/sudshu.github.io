research:
  - id: co2-growth-rate
    title: "How fast CO<sub>2</sub> is building up in the atmosphere"
    text: |
      Satellites such as NASA's OCO-2 measure carbon dioxide all over the globe. I developed satellite-derived whole-atmosphere CO<sub>2</sub> growth-rate methods now adopted in Global Carbon Project workflow.

      They give an early, independent measure of how fast CO<sub>2</sub> is building up in the atmosphere, which, compared with emissions, shows how much of what we emit stays in the air.
    papers:
      - "Pandey et al. (2024), *AGU Advances*. [doi:10.1029/2023AV001145](https://doi.org/10.1029/2023AV001145)"
      - "Pandey et al. (2025), *Nature Communications*. [doi:10.1038/s41467-025-61588-2](https://doi.org/10.1038/s41467-025-61588-2)"
      - "Pandey (2025), *AGU Advances*. [doi:10.1029/2025AV002085](https://doi.org/10.1029/2025AV002085)"
      - "Pandey et al. (2026), preprint, under review. [doi:10.21203/rs.3.rs-9854768/v1](https://doi.org/10.21203/rs.3.rs-9854768/v1)"
    also_post: traveling-co2
    also_text: "a short poem about this work."
    figure:
      base: /assets/research/co2-growth-rate
      width: 1247
      height: 942
      alt: "Two panels. Top: deseasonalized monthly CO2 growth rate from NASA's OCO-2 satellite, 2015 to 2025, shown with fossil fuel emissions and global surface temperature. Bottom: the growth rate in four latitude bands, with labeled events such as El Niño fires and drought, the Canadian fires, and Amazon fires."
      caption: "Monthly CO<sub>2</sub> growth rate from NASA's OCO-2 satellite, for the whole globe (top) and by latitude band (bottom). From Pandey (2025), *AGU Advances*, CC BY-NC."

  - id: methane-leaks
    title: "Finding methane leaks from space"
    text: |
      Methane is a strong greenhouse gas, and large leaks can go unnoticed on the ground. I led the first satellite detection of a previously unreported extreme methane release, which came from a natural gas well blowout in Ohio. It helped establish the potential of satellite observations for identifying large methane point sources, and satellites are now widely used to find such leaks so they can be fixed.

      In later work, I showed how three satellites can work together: Sentinel-5P scans the whole globe every day for large plumes, Sentinel-3 sees them daily in finer detail, and Sentinel-2 pinpoints the facility responsible, as in the example shown here.
    papers:
      - "Pandey et al. (2019), *PNAS*. [doi:10.1073/pnas.1908712116](https://doi.org/10.1073/pnas.1908712116)"
      - "Pandey et al. (2023), *Remote Sensing of Environment*, on finding leaks daily with the Sentinel-3 satellites. [doi:10.1016/j.rse.2023.113716](https://doi.org/10.1016/j.rse.2023.113716)"
    figure:
      base: /assets/research/methane-sentinel
      width: 1600
      height: 789
      alt: "Three satellite views of one methane plume near Hassi Messaoud, Algeria. Left: a Sentinel-5P map with a long plume blowing to the northeast. Middle: a Sentinel-3 view zoomed in on the plume. Right: a Sentinel-2 view zoomed in on the source facility."
      caption: "The same methane plume near Hassi Messaoud, Algeria, seen by three satellites on 4 January 2020: Sentinel-5P (left), Sentinel-3 (middle), and Sentinel-2 (right), each zooming in on the source. From Pandey et al. (2023), *Remote Sensing of Environment*."

  - id: compass
    title: "Learning about winds from air-pollution maps"
    status: "Preprint, under review"
    text: |
      We can't see the wind, but we can see what it carries. Smoke, smog, and other gases are pushed and stirred by the wind, so their patterns keep a record of how the air has moved. In COMPASS, I asked whether satellite maps of air pollution can tell us about the winds and mixing that shaped them.

      Using machine learning, the study finds that snapshots of atmospheric composition carry information about the winds and the depth of the well-mixed layer of air near the ground, both in global model simulations and in real observations from NASA's TEMPO mission, which was built to measure air pollution, not winds. This suggests that composition satellites could become a new source of information for weather and air-quality forecasting.
    papers:
      - "Pandey (2026), preprint, under review. [doi:10.21203/rs.3.rs-10781568/v1](https://doi.org/10.21203/rs.3.rs-10781568/v1)"
    figure:
      base: /assets/research/compass-concept
      width: 1418
      height: 783
      alt: "Diagram. Left: four global maps from one snapshot of atmospheric composition, showing methane, carbon monoxide, ozone, and nitrogen dioxide. Middle: a neural network. Right: the fields it maps them to: surface wind speed, 500 hPa wind speed, and boundary-layer height."
      caption: "How COMPASS works: a neural network takes one snapshot of methane, carbon monoxide, ozone, and nitrogen dioxide from a global model, plus terrain and latitude, and maps it to winds and boundary-layer height, with no wind or other weather data as input. The maps on the right are the target fields, not predictions. Conceptual illustration from Pandey (2026), preprint under review."

interests:
  - "Agentic AI that helps with research, from forming hypotheses to weighing evidence, while scientists make the key decisions."
  - "Machine learning and data-driven equation discovery: finding simple equations behind patterns in Earth observations."
  - "Inverse modeling and Bayesian optimization, and visualizing their solution spaces: the many combinations of parameters that can explain the same observations."
  - "The philosophy of science and AI: what counts as understanding, and how prediction relates to explanation."


