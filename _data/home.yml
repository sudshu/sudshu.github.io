about: |
  I am a scientist in the Earth Science Section at NASA's Jet Propulsion Laboratory, where I have worked since 2022. From 2016 to 2022, I was a scientist at SRON, the Netherlands Institute for Space Research. I did my PhD in physics at the Institute for Marine and Atmospheric Research Utrecht, Utrecht University (2017), and a combined BS-MS degree in Earth Sciences at the Indian Institute of Science Education and Research (IISER) Kolkata (2012).

footer_note: "Views and weekend experiments here are my own and don't represent NASA or JPL."
